name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.configuration-cache=false

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. SDK PACKAGES
      # ============================================================
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK installed."


      # ============================================================
      # 5. FIND ZIP
      # ============================================================
      - name: Find ZIP project
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r FILE; do
            ZIP_FILE="$FILE"
            break
          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./android-project/*" \
              ! -path "./output/*" \
              | sort
          )

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP project found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "ZIP selected:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. EXTRACT ZIP
      # ============================================================
      - name: Extract ZIP project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted."

          echo
          echo "Project structure:"
          find android-project \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -600


      # ============================================================
      # 7. DETECT PROJECT ROOT
      # ============================================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          GRADLEW=""

          while IFS= read -r FILE; do
            GRADLEW="$FILE"
            break
          done < <(
            find android-project \
              -type f \
              -name "gradlew" \
              | sort
          )

          SETTINGS=""

          while IFS= read -r FILE; do
            SETTINGS="$FILE"
            break
          done < <(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | sort
          )

          BUILD_FILE=""

          while IFS= read -r FILE; do
            BUILD_FILE="$FILE"
            break
          done < <(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort
          )

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR="$(dirname "$GRADLEW")"

          elif [ -n "$SETTINGS" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS")"

          elif [ -n "$BUILD_FILE" ]; then

            PROJECT_DIR="$(dirname "$BUILD_FILE")"

          else

            echo "::error::No Android Gradle project detected."

            find android-project \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "PROJECT ROOT:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. SHOW PROJECT FILES
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo
          echo "Important files:"

          find . \
            -maxdepth 6 \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            | sort


      # ============================================================
      # 9. PREPARE WRAPPER
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Existing Gradle Wrapper detected."

          else

            echo "Gradle Wrapper is incomplete."
            echo "Generating wrapper."

            TEMP_GRADLE="/tmp/gradle"

            rm -rf "$TEMP_GRADLE"

            mkdir -p "$TEMP_GRADLE"

            curl -fsSL \
              -o "$TEMP_GRADLE/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

            unzip -q \
              "$TEMP_GRADLE/gradle.zip" \
              -d "$TEMP_GRADLE"

            export PATH="$TEMP_GRADLE/gradle-9.3.1/bin:$PATH"

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          echo
          echo "Gradle version:"
          ./gradlew --version


      # ============================================================
      # 10. GRADLE SETUP
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success


      # ============================================================
      # 11. JAVA + GRADLE ENVIRONMENT
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          ./gradlew --version

          echo
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          sdkmanager --list_installed \
            | head -n 200 \
            || true


      # ============================================================
      # 12. LIST GRADLE TASKS
      # ============================================================
      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          ./gradlew tasks \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/tasks.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo
            echo "Gradle tasks command failed."

            tail -n 250 \
              build-logs/tasks.log \
              || true

            exit "$EXIT_CODE"

          fi


      # ============================================================
      # 13. CHECK ANDROID MODULES
      # ============================================================
      - name: Detect Android modules
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ANDROID MODULES"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -name "AndroidManifest.xml" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
            \) \
            | sort \
            | head -n 300


      # ============================================================
      # 14. GOOGLE SERVICES CHECK
      # ============================================================
      - name: Check Google Services
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          GOOGLE_FILE="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_FILE" ]; then

            echo "google-services.json found:"
            echo "$GOOGLE_FILE"

          else

            echo "google-services.json not found."

            echo
            echo "Checking whether project actually uses Google Services:"

            grep -RniE \
              "google-services|com.google.gms.google-services" \
              . \
              --include="*.gradle" \
              --include="*.gradle.kts" \
              | head -n 100 \
              || true

          fi


      # ============================================================
      # 15. DEBUG KEYSTORE
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo "Debug keystore ready."


      # ============================================================
      # 16. CLEAN
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/clean.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo
            echo "CLEAN FAILED"

            tail -n 300 \
              build-logs/clean.log \
              || true

            exit "$EXIT_CODE"

          fi


      # ============================================================
      # 17. BUILD APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          echo "=========================================="
          echo "START APK BUILD"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/assembleDebug.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "FAILED TASKS:"

            grep -nE \
              "> Task .* FAILED|Execution failed for task|FAILED" \
              build-logs/assembleDebug.log \
              | tail -n 100 \
              || true

            echo
            echo "WHAT WENT WRONG:"

            grep -n \
              -A 100 \
              "What went wrong:" \
              build-logs/assembleDebug.log \
              | tail -n 150 \
              || true

            echo
            echo "ROOT CAUSE:"

            grep -nE \
              "Caused by:|Exception:|error:|Error:" \
              build-logs/assembleDebug.log \
              | tail -n 200 \
              || true

            echo
            echo "LAST 400 LINES:"

            tail -n 400 \
              build-logs/assembleDebug.log \
              || true

            exit "$EXIT_CODE"

          fi

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="


      # ============================================================
      # 18. FIND APK
      # ============================================================
      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei \
                "/(debug|release)/.*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )

          fi

          if [ -z "$APK" ]; then

            echo "::error::No APK generated."

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              | sort

            exit 1

          fi

          rm -rf output
          mkdir -p output

          cp "$APK" output/app-debug.apk

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo
          echo "Generated APK:"
          echo "$APK"

          echo
          ls -lh output/app-debug.apk


      # ============================================================
      # 19. APK ANALYSIS
      # ============================================================
      - name: APK information
        if: success()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "APK"
          echo "=========================================="

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then

            echo
            apkanalyzer \
              apk summary \
              output/app-debug.apk \
              || true

          fi


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. UPLOAD COMPLETE LOGS
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-build-diagnostics
          path: |
            android-project/**/build-logs/**
            android-project/**/build/reports/**
            android-project/**/build/test-results/**
            android-project/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 22. FINAL FAILURE REPORT
      # ============================================================
      - name: Final failure report
        if: failure()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "FINAL BUILD FAILURE REPORT"
          echo "=================================================="

          LOG="$PROJECT_DIR/build-logs/assembleDebug.log"

          if [ -f "$LOG" ]; then

            echo
            echo "FAILED TASK:"
            grep -nE \
              "> Task .* FAILED|Execution failed for task" \
              "$LOG" \
              | tail -n 50 \
              || true

            echo
            echo "WHAT WENT WRONG:"
            grep -n \
              -A 80 \
              "What went wrong:" \
              "$LOG" \
              | tail -n 100 \
              || true

            echo
            echo "CAUSE:"
            grep -nE \
              "Caused by:|error:|Error:|Exception:" \
              "$LOG" \
              | tail -n 150 \
              || true

          else

            echo "assembleDebug log does not exist."

          fi
