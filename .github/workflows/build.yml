name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. Setup Java
      # مهم: لا نضع cache: gradle هنا
      # لأن مشروع Gradle موجود داخل ZIP
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: false


      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. تثبيت أدوات Android
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"


      # ============================================================
      # 5. البحث عن ZIP
      # ============================================================
      - name: Find ZIP project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./android-project/*" \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo
            echo "ZIP files currently available:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. فك الضغط
      # ============================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted successfully."

          echo
          echo "Project tree:"
          find android-project -maxdepth 4 -type f | sort | head -300


      # ============================================================
      # 7. اكتشاف مشروع Android
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          GRADLEW="$(
            find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1
          )"

          SETTINGS="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          BUILD_FILE="$(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR="$(dirname "$GRADLEW")"

            echo "Found Gradle wrapper."

          elif [ -n "$SETTINGS" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS")"

            echo "Found Gradle settings file."

          elif [ -n "$BUILD_FILE" ]; then

            PROJECT_DIR="$(dirname "$BUILD_FILE")"

            echo "Found Gradle build file."

          else

            echo "ERROR: No Android Gradle project found."
            echo
            echo "Detected files:"
            find android-project -maxdepth 5 -type f | sort | head -500

            exit 1

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Detected Android project:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. فحص ملفات المشروع قبل الإصلاح
      # ============================================================
      - name: Inspect Gradle project
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ROOT PROJECT"
          echo "========================================"

          pwd

          echo
          echo "Files:"

          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print


      # ============================================================
      # 9. تثبيت Gradle 9.3.1
      # ============================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"

          if command -v gradle >/dev/null 2>&1; then
            echo "System Gradle already exists."
            gradle --version
          else

            curl -fsSL \
              -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            sudo rm -rf "/opt/gradle-${GRADLE_VERSION}"

            sudo unzip -q \
              /tmp/gradle.zip \
              -d /opt

            echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

            export PATH="/opt/gradle-${GRADLE_VERSION}/bin:$PATH"

            gradle --version

          fi


      # ============================================================
      # 10. تجهيز Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle wrapper properties found."

            sed -i -E \
              's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties

          fi

          if [ ! -f "./gradlew" ]; then

            echo "gradlew not found."
            echo "Generating wrapper..."

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Wrapper properties still missing."
            echo "Generating wrapper again..."

            ./gradlew wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          sed -i -E \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle wrapper prepared."

          ./gradlew --version


      # ============================================================
      # 11. إصلاح Google Services
      # ============================================================
      - name: Handle Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          GOOGLE_JSON="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_JSON" ]; then

            echo "google-services.json found."
            echo "$GOOGLE_JSON"

          else

            echo "google-services.json NOT found."
            echo "Removing Google Services plugin references."

            while IFS= read -r -d '' FILE; do

              echo "Checking: $FILE"

              sed -i \
                '/com\.google\.gms\.google-services/d' \
                "$FILE" || true

              sed -i \
                '/apply plugin:.*google-services/d' \
                "$FILE" || true

              sed -i \
                '/google-services/d' \
                "$FILE" || true

            done < <(
              find . \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print0
            )

          fi


      # ============================================================
      # 12. إنشاء debug.keystore
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then

            echo "Generating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else

            echo "debug.keystore already exists."

          fi

          echo "Debug keystore:"
          ls -lh "$DEBUG_KEYSTORE"


      # ============================================================
      # 13. تنظيف المشروع
      # ============================================================
      - name: Gradle clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 14. بناء Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 15. البحث عن APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei \
                "(debug|unsigned).*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Possible APK output directories:"

            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs/*" \
              -print

            exit 1

          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output

          cp \
            "$APK" \
            output/app-debug.apk

          echo
          echo "APK copied to:"
          ls -lh output/app-debug.apk


      # ============================================================
      # 16. معلومات APK
      # ============================================================
      - name: APK information
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "APK INFORMATION"
          echo "========================================"

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer apk summary output/app-debug.apk
          fi


      # ============================================================
      # 17. رفع APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. رفع تقارير الأخطاء عند فشل البناء
      # ============================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            android-project/**/build/reports/**
            android-project/**/build/outputs/logs/**
            android-project/**/*.log
          if-no-files-found: ignore
          retention-days: 7
