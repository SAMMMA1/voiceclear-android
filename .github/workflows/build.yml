name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
      CI: true

    steps:

      # ============================================================
      # 1. تحميل ملفات المستودع
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. إعداد Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. إعداد Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. تثبيت أدوات Android المطلوبة
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ============================================================
      # 5. العثور على ملف ZIP
      # ============================================================
      - name: Find ZIP project
        shell: bash
        run: |
          echo "ZIP files found:"
          find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            -print

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. فك الضغط
      # ============================================================
      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "Extracted project:"
          find android-project -maxdepth 3 -type f | head -200


      # ============================================================
      # 7. اكتشاف مشروع Android
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |

          echo "Searching for Gradle project..."

          GRADLEW=$(find android-project \
            -type f \
            -name "gradlew" \
            | head -n 1)

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR=$(dirname "$GRADLEW")

            echo "Gradle wrapper found:"
            echo "$GRADLEW"

          else

            echo "No Gradle wrapper found."

            SETTINGS=$(find android-project \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android Gradle project not found."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")

            echo "Project detected from settings file:"
            echo "$PROJECT_DIR"

          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. إنشاء Gradle Wrapper إذا لم يكن موجوداً
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            echo "Gradle wrapper already exists."

            chmod +x ./gradlew

          else

            echo "Gradle wrapper not found."

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

              echo "Wrapper properties found."

              mkdir -p gradle/wrapper

              cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF

            else

              echo "Creating Gradle wrapper using system Gradle."

              gradle wrapper --gradle-version 9.3.1

            fi

            chmod +x ./gradlew

          fi


      # ============================================================
      # 9. عرض معلومات المشروع
      # ============================================================
      - name: Project information
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          echo "Directory:"
          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo ""
          echo "Gradle:"
          ./gradlew --version || true


      # ============================================================
      # 10. إصلاح google-services الشائع
      # ============================================================
      - name: Remove broken Google Services references
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          echo "Checking Google Services configuration..."

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            echo "Checking: $FILE"

            # حذف تطبيق Google Services plugin
            sed -i \
              '/com\.google\.gms\.google-services/d' \
              "$FILE" || true

            # حذف google-services plugin بصيغة apply
            sed -i \
              '/apply plugin:.*google-services/d' \
              "$FILE" || true

          done


      # ============================================================
      # 11. حذف اعتماد google-services.json إذا كان مفقوداً
      # ============================================================
      - name: Check Google Services JSON
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          if find . -name "google-services.json" | grep -q .; then

            echo "google-services.json exists."

          else

            echo "google-services.json not found."

            echo "Build will continue without Google Services."

          fi


      # ============================================================
      # 12. تنظيف المشروع
      # ============================================================
      - name: Gradle clean
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            || true


      # ============================================================
      # 13. تحميل Dependencies وبناء Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ============================================================
      # 14. البحث عن APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E "debug.*\.apk$" \
            | head -n 1)

          if [ -z "$APK" ]; then

            APK=$(find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1)

          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p output

          cp "$APK" output/app-debug.apk

          echo "APK_PATH=output/app-debug.apk" >> "$GITHUB_ENV"


      # ============================================================
      # 15. عرض معلومات APK
      # ============================================================
      - name: APK information
        shell: bash
        run: |

          echo "========================================"
          echo "APK INFORMATION"
          echo "========================================"

          ls -lh "$APK_PATH"

          if command -v apkanalyzer >/dev/null 2>&1; then

            apkanalyzer apk summary "$APK_PATH" || true

          fi


      # ============================================================
      # 16. رفع APK كـ Artifact
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30
