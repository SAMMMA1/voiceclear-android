name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.caching=false
        -Dorg.gradle.configuration-cache=false

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. Setup Java 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."


      # ============================================================
      # 5. Find ZIP
      # ============================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          while IFS= read -r FILE
          do
            ZIP_FILE="$FILE"
            break
          done < <(
            find . \
              -maxdepth 3 \
              -type f \
              -iname '*.zip' \
              ! -path './android-project/*' \
              ! -path './output/*' \
              | sort
          )

          if [ -z "$ZIP_FILE" ]
          then
            echo "::error::No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. Extract ZIP
      # ============================================================
      - name: Extract ZIP project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted successfully."


      # ============================================================
      # 7. Detect Android project
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          GRADLEW=""

          while IFS= read -r FILE
          do
            GRADLEW="$FILE"
            break
          done < <(
            find android-project \
              -type f \
              -name 'gradlew' \
              | sort
          )

          SETTINGS=""

          while IFS= read -r FILE
          do
            SETTINGS="$FILE"
            break
          done < <(
            find android-project \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              | sort
          )

          BUILD_FILE=""

          while IFS= read -r FILE
          do
            BUILD_FILE="$FILE"
            break
          done < <(
            find android-project \
              -type f \
              \( \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
              \) \
              | sort
          )

          if [ -n "$GRADLEW" ]
          then
            PROJECT_DIR="$(dirname "$GRADLEW")"

          elif [ -n "$SETTINGS" ]
          then
            PROJECT_DIR="$(dirname "$SETTINGS")"

          elif [ -n "$BUILD_FILE" ]
          then
            PROJECT_DIR="$(dirname "$BUILD_FILE")"

          else
            echo "::error::Android Gradle project not found."
            find android-project -maxdepth 10 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. Show project information
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          pwd

          echo
          echo "Important files:"

          find . \
            -maxdepth 7 \
            -type f \
            \( \
              -name 'gradlew' \
              -o \
              -name 'gradle-wrapper.properties' \
              -o \
              -name 'settings.gradle' \
              -o \
              -name 'settings.gradle.kts' \
              -o \
              -name 'build.gradle' \
              -o \
              -name 'build.gradle.kts' \
              -o \
              -name 'gradle.properties' \
              -o \
              -name 'google-services.json' \
              -o \
              -name 'debug.keystore' \
            \) \
            | sort


      # ============================================================
      # 9. Prepare Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]
          then

            echo "Existing Gradle Wrapper found."

          else

            echo "Gradle Wrapper missing or incomplete."

            TMP_DIR="/tmp/gradle-bootstrap"

            rm -rf "$TMP_DIR"
            mkdir -p "$TMP_DIR"

            curl -fsSL \
              -o "$TMP_DIR/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

            unzip -q \
              "$TMP_DIR/gradle.zip" \
              -d "$TMP_DIR"

            export PATH="$TMP_DIR/gradle-9.3.1/bin:$PATH"

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          echo
          echo "Gradle version:"
          ./gradlew --version


      # ============================================================
      # 10. Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true


      # ============================================================
      # 11. Disable Gradle caches
      # ============================================================
      - name: Disable Gradle caches
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          touch gradle.properties

          sed -i \
            '/^org\.gradle\.caching=/d' \
            gradle.properties

          sed -i \
            '/^org\.gradle\.configuration-cache=/d' \
            gradle.properties

          echo "org.gradle.caching=false" \
            >> gradle.properties

          echo "org.gradle.configuration-cache=false" \
            >> gradle.properties


      # ============================================================
      # 12. Prepare debug.keystore
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]
          then

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'

          fi

          echo "Global keystore:"
          ls -lh "$KEYSTORE"

          echo
          echo "Copying keystore to project root..."

          cp \
            "$KEYSTORE" \
            "$PROJECT_DIR/debug.keystore"

          chmod 644 \
            "$PROJECT_DIR/debug.keystore"

          echo
          echo "Project keystore:"
          ls -lh "$PROJECT_DIR/debug.keystore"

          if [ -d "$PROJECT_DIR/app" ]
          then

            cp \
              "$KEYSTORE" \
              "$PROJECT_DIR/app/debug.keystore"

            chmod 644 \
              "$PROJECT_DIR/app/debug.keystore"

            echo
            echo "App keystore:"
            ls -lh "$PROJECT_DIR/app/debug.keystore"

          fi


      # ============================================================
      # 13. Verify keystore
      # ============================================================
      - name: Verify debug keystore
        shell: bash
        run: |
          set -e

          if [ ! -f "$PROJECT_DIR/debug.keystore" ]
          then
            echo "::error::debug.keystore missing from project root."
            exit 1
          fi

          echo "debug.keystore verified."


      # ============================================================
      # 14. Gradle environment
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          ./gradlew --version


      # ============================================================
      # 15. Validate Gradle
      # ============================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          ./gradlew help \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/help.log


      # ============================================================
      # 16. Clean
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/clean.log


      # ============================================================
      # 17. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/assembleDebug.log

          BUILD_CODE=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $BUILD_CODE"

          if [ "$BUILD_CODE" -ne 0 ]
          then

            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "Failed tasks:"

            grep -nE \
              'Execution failed for task|> Task .* FAILED' \
              build-logs/assembleDebug.log \
              || true

            echo
            echo "What went wrong:"

            grep -n \
              -A 100 \
              'What went wrong:' \
              build-logs/assembleDebug.log \
              || true

            echo
            echo "Last 300 lines:"

            tail -n 300 \
              build-logs/assembleDebug.log \
              || true

            exit "$BUILD_CODE"

          fi

          echo
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 18. Find APK
      #
      # لا يوجد grep أو command substitution معقد
      # ============================================================
      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          mkdir -p output

          APK_FILE=""

          while IFS= read -r FILE
          do
            APK_FILE="$FILE"
            break
          done < <(
            find "$PROJECT_DIR" \
              -type f \
              -name '*.apk' \
              -print
          )

          if [ -z "$APK_FILE" ]
          then
            echo "::error::No APK file was generated."

            echo
            echo "Available build outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path '*/build/outputs/*' \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "APK found:"
          echo "$APK_FILE"

          cp \
            "$APK_FILE" \
            output/app-debug.apk

          echo
          echo "Final APK:"
          ls -lh output/app-debug.apk


      # ============================================================
      # 19. Verify APK exists
      # ============================================================
      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          if [ ! -f "output/app-debug.apk" ]
          then
            echo "::error::Final APK file does not exist."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "output/app-debug.apk")

          echo "APK size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -le 0 ]
          then
            echo "::error::APK file is empty."
            exit 1
          fi

          echo "APK verified successfully."


      # ============================================================
      # 20. APK information
      # ============================================================
      - name: APK information
        if: success()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "APK INFORMATION"
          echo "=========================================="

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1
          then

            echo
            echo "APK summary:"

            apkanalyzer \
              apk summary \
              output/app-debug.apk \
              || true

          fi


      # ============================================================
      # 21. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 22. Upload diagnostics
      # ============================================================
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-build-diagnostics
          path: |
            android-project/**/build-logs/**
            android-project/**/build/reports/**
            android-project/**/build/test-results/**
            android-project/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 23. Failure summary
      # ============================================================
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          echo
          echo "=========================================="
          echo "BUILD FAILURE SUMMARY"
          echo "=========================================="

          if [ -d "$PROJECT_DIR/build-logs" ]
          then

            echo
            echo "Log files:"

            find "$PROJECT_DIR/build-logs" \
              -type f \
              -print \
              | sort

            echo
            echo "Important errors:"

            grep -RniE \
              'Execution failed for task|What went wrong:|Caused by:|Exception:|error:' \
              "$PROJECT_DIR/build-logs" \
              | tail -n 200 \
              || true

          fi
