name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."


      # ============================================================
      # 5. Find ZIP
      # ============================================================
      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./android-project/*" \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. Extract
      # ============================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted successfully."

          echo
          echo "Files:"
          find android-project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 7. Detect project root
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          GRADLEW="$(
            find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1
          )"

          SETTINGS="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          BUILD="$(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR="$(dirname "$GRADLEW")"

          elif [ -n "$SETTINGS" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS")"

          elif [ -n "$BUILD" ]; then

            PROJECT_DIR="$(dirname "$BUILD")"

          else

            echo "::error::Android Gradle project not found."

            find android-project \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Detected project:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. Detect AGP version
      # ============================================================
      - name: Detect Android Gradle Plugin
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "AGP DETECTION"
          echo "========================================"

          echo
          echo "Possible AGP declarations:"

          grep -RniE \
            "com.android.tools.build:gradle|com.android.application.*version|com.android.library.*version" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -n 100 \
            || true


      # ============================================================
      # 9. Prepare Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle wrapper properties missing."

            if command -v gradle >/dev/null 2>&1; then

              gradle wrapper \
                --gradle-version 9.3.1 \
                --distribution-type bin

            else

              curl -fsSL \
                -o /tmp/gradle.zip \
                "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

              sudo unzip -q \
                /tmp/gradle.zip \
                -d /opt

              export PATH="/opt/gradle-9.3.1/bin:$PATH"

              gradle wrapper \
                --gradle-version 9.3.1 \
                --distribution-type bin

            fi

          fi

          if [ ! -f "./gradlew" ]; then

            echo "gradlew missing."

            if command -v gradle >/dev/null 2>&1; then

              gradle wrapper \
                --gradle-version 9.3.1 \
                --distribution-type bin

            else

              curl -fsSL \
                -o /tmp/gradle.zip \
                "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

              sudo unzip -q \
                /tmp/gradle.zip \
                -d /opt

              export PATH="/opt/gradle-9.3.1/bin:$PATH"

              gradle wrapper \
                --gradle-version 9.3.1 \
                --distribution-type bin

            fi

          fi

          chmod +x ./gradlew

          echo
          echo "Wrapper:"
          ./gradlew --version


      # ============================================================
      # 10. Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success


      # ============================================================
      # 11. Disable configuration cache for diagnosis
      # ============================================================
      - name: Disable Gradle configuration cache
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "gradle.properties" ]; then

            sed -i \
              '/^org\.gradle\.configuration-cache=/d' \
              gradle.properties

            echo "org.gradle.configuration-cache=false" \
              >> gradle.properties

          else

            echo "org.gradle.configuration-cache=false" \
              > gradle.properties

          fi

          echo "Configuration cache disabled for this build."


      # ============================================================
      # 12. Google Services handling
      # ============================================================
      - name: Handle Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          GOOGLE_FILE="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_FILE" ]; then

            echo "google-services.json found."

          else

            echo "google-services.json not found."
            echo "Removing Google Services plugin lines."

            while IFS= read -r -d '' FILE; do

              sed -i \
                '/com\.google\.gms\.google-services/d' \
                "$FILE" || true

              sed -i \
                '/apply plugin:.*google-services/d' \
                "$FILE" || true

            done < <(
              find . \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print0
            )

          fi


      # ============================================================
      # 13. Debug keystore
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          ls -lh "$KEYSTORE"


      # ============================================================
      # 14. Gradle environment report
      # ============================================================
      - name: Gradle environment
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          ./gradlew --version

          echo
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          sdkmanager --list_installed \
            | head -n 150 \
            || true


      # ============================================================
      # 15. Gradle help validation
      # ============================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          ./gradlew help \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/gradle-help.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi


      # ============================================================
      # 16. Clean
      # ============================================================
      - name: Clean
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/gradle-clean.log

          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then
            exit "$EXIT_CODE"
          fi


      # ============================================================
      # 17. Build APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/gradle-build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "FAILED TASKS"
            echo "=========================================="

            grep -E \
              "^> Task |FAILED|FAILURE:|What went wrong:|Execution failed for task|Caused by:" \
              build-logs/gradle-build.log \
              | tail -n 200 \
              || true

            echo
            echo "=========================================="
            echo "LAST 350 LINES"
            echo "=========================================="

            tail -n 350 \
              build-logs/gradle-build.log \
              || true

            exit "$EXIT_CODE"
          fi

          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 18. Find APK
      # ============================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei "debug.*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )

          fi

          if [ -z "$APK" ]; then

            echo "::error::Build finished but no APK was found."

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              | sort

            exit 1

          fi

          rm -rf output
          mkdir -p output

          cp "$APK" output/app-debug.apk

          echo "APK found:"
          echo "$APK"

          ls -lh output/app-debug.apk


      # ============================================================
      # 19. APK information
      # ============================================================
      - name: APK information
        if: success()
        shell: bash
        run: |
          set +e

          echo "APK:"
          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then

            echo
            echo "APK summary:"

            apkanalyzer \
              apk summary \
              output/app-debug.apk

          fi


      # ============================================================
      # 20. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. Upload diagnostics
      # ============================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            android-project/**/build-logs/**
            android-project/**/build/reports/**
            android-project/**/build/test-results/**
            android-project/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 22. Print actual Gradle error
      # ============================================================
      - name: Print actual build error
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "ACTUAL GRADLE ERROR"
          echo "=========================================="

          LOG="$PROJECT_DIR/build-logs/gradle-build.log"

          if [ -f "$LOG" ]; then

            echo
            echo "---- What went wrong ----"

            grep -n \
              -A 80 \
              "What went wrong:" \
              "$LOG" \
              | tail -n 120 \
              || true

            echo
            echo "---- Failed task ----"

            grep -n \
              -E \
              "Execution failed for task|> Task .* FAILED|FAILED" \
              "$LOG" \
              | tail -n 100 \
              || true

            echo
            echo "---- Root cause ----"

            grep -n \
              -E \
              "Caused by:|Exception:|Error:" \
              "$LOG" \
              | tail -n 150 \
              || true

          else

            echo "Gradle log was not found."

          fi
