name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.caching=false
        -Dorg.gradle.configuration-cache=false

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."


      # ============================================================
      # 5. FIND ZIP
      # ============================================================
      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              | sort \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. EXTRACT
      # ============================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted."


      # ============================================================
      # 7. DETECT PROJECT
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          GRADLEW="$(
            find android-project \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1
          )"

          SETTINGS="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | sort \
              | head -n 1
          )"

          ROOT_BUILD="$(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"

          elif [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"

          elif [ -n "$ROOT_BUILD" ]; then
            PROJECT_DIR="$(dirname "$ROOT_BUILD")"

          else
            echo "::error::Android Gradle project not found."

            find android-project \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Detected:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. SHOW ORIGINAL PROJECT
      # ============================================================
      - name: Inspect original project
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          find . \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -800

          echo
          echo "=========================================="
          echo "GRADLE FILES"
          echo "=========================================="

          find . \
            -maxdepth 6 \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle.properties" \
            \) \
            | sort


      # ============================================================
      # 9. PREPARE WRAPPER
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Existing Gradle Wrapper found."

          else

            echo "Gradle Wrapper incomplete."

            TEMP_DIR="/tmp/gradle-bootstrap"

            rm -rf "$TEMP_DIR"
            mkdir -p "$TEMP_DIR"

            curl -fsSL \
              -o "$TEMP_DIR/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

            unzip -q \
              "$TEMP_DIR/gradle.zip" \
              -d "$TEMP_DIR"

            export PATH="$TEMP_DIR/gradle-9.3.1/bin:$PATH"

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          echo
          echo "Wrapper version:"
          ./gradlew --version


      # ============================================================
      # 10. GRADLE SETUP
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true


      # ============================================================
      # 11. BUILD ENVIRONMENT
      # ============================================================
      - name: Print build environment
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          ./gradlew --version

          echo
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          sdkmanager --list_installed \
            | head -n 200 \
            || true


      # ============================================================
      # 12. GRADLE TASK LIST
      # ============================================================
      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          ./gradlew tasks \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/tasks.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "Gradle task discovery failed."

            echo
            echo "LAST 300 LINES:"

            tail -n 300 \
              build-logs/tasks.log \
              || true

            exit "$CODE"
          fi


      # ============================================================
      # 13. GOOGLE SERVICES - DETECTION ONLY
      # ============================================================
      - name: Inspect Google Services
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GOOGLE SERVICES"
          echo "=========================================="

          GOOGLE_JSON="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_JSON" ]; then
            echo "google-services.json:"
            echo "$GOOGLE_JSON"
          else
            echo "google-services.json: NOT FOUND"
          fi

          echo
          echo "Google Services references:"

          grep -RniE \
            "google-services|com.google.gms.google-services" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -n 100 \
            || true


      # ============================================================
      # 14. DEBUG KEYSTORE
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo "Debug keystore ready."


      # ============================================================
      # 15. GRADLE HELP
      # ============================================================
      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew help \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/help.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "GRADLE CONFIGURATION ERROR"
            echo "=========================================="

            grep -nE \
              "What went wrong:|FAILURE:|Execution failed|Caused by:|error:|Error:" \
              build-logs/help.log \
              | tail -n 200 \
              || true

            exit "$CODE"
          fi


      # ============================================================
      # 16. CLEAN
      # ============================================================
      - name: Clean
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/clean.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "CLEAN FAILED"
            echo "=========================================="

            tail -n 350 \
              build-logs/clean.log \
              || true

            exit "$CODE"
          fi


      # ============================================================
      # 17. BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ASSEMBLE DEBUG APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/assembleDebug.log

          CODE=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "FAILED TASK"
            echo "=========================================="

            grep -nE \
              "> Task .* FAILED|Execution failed for task" \
              build-logs/assembleDebug.log \
              | tail -n 100 \
              || true

            echo
            echo "=========================================="
            echo "WHAT WENT WRONG"
            echo "=========================================="

            grep -n \
              -A 120 \
              "What went wrong:" \
              build-logs/assembleDebug.log \
              | tail -n 160 \
              || true

            echo
            echo "=========================================="
            echo "ROOT CAUSE"
            echo "=========================================="

            grep -nE \
              "Caused by:|error:|Error:|Exception:" \
              build-logs/assembleDebug.log \
              | tail -n 250 \
              || true

            echo
            echo "=========================================="
            echo "LAST 500 LINES"
            echo "=========================================="

            tail -n 500 \
              build-logs/assembleDebug.log \
              || true

            exit "$CODE"
          fi

          echo
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 18. FIND APK
      # ============================================================
      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei \
                "debug.*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )

          fi

          if [ -z "$APK" ]; then

            echo "::error::APK was not generated."

            echo
            echo "Build outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              | sort

            exit 1
          fi

          rm -rf output
          mkdir -p output

          cp "$APK" output/app-debug.apk

          echo "APK:"
          echo "$APK"

          echo
          ls -lh output/app-debug.apk


      # ============================================================
      # 19. APK INFO
      # ============================================================
      - name: APK information
        if: success()
        shell: bash
        run: |
          set +e

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then

            echo
            apkanalyzer \
              apk summary \
              output/app-debug.apk \
              || true

          fi


      # ============================================================
      # 20. UPLOAD APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 21. UPLOAD ALL DIAGNOSTICS
      # ============================================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-build-diagnostics
          path: |
            android-project/**/build-logs/**
            android-project/**/build/reports/**
            android-project/**/build/test-results/**
            android-project/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 22. FINAL FAILURE SUMMARY
      # ============================================================
      - name: Final failure summary
        if: failure()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "FINAL FAILURE SUMMARY"
          echo "=================================================="

          LOG="$PROJECT_DIR/build-logs/assembleDebug.log"

          if [ -f "$LOG" ]; then

            echo
            echo "FAILED TASK:"
            grep -nE \
              "> Task .* FAILED|Execution failed for task" \
              "$LOG" \
              | tail -n 50 \
              || true

            echo
            echo "CAUSE:"
            grep -nE \
              "Caused by:|error:|Error:|Exception:" \
              "$LOG" \
              | tail -n 150 \
              || true

          else

            echo "assembleDebug log not found."

          fi
