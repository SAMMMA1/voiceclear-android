name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"

          curl -fsSL \
            -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          sudo rm -rf "/opt/gradle-${GRADLE_VERSION}"

          sudo unzip -q \
            /tmp/gradle.zip \
            -d /opt

          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Find ZIP project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . \
            -maxdepth 3 \
            -type f \
            -iname '*.zip' \
            ! -path './android-project/*' \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in the repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q \
            "$ZIP_FILE" \
            -d android-project

          echo "Extracted files:"

          find android-project \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -200

      - name: Detect Android Gradle project
        shell: bash
        run: |
          set -e

          GRADLEW="$(
            find android-project \
              -type f \
              -name 'gradlew' \
              | head -n 1
          )"

          SETTINGS="$(
            find android-project \
              -type f \
              \( \
                -name 'settings.gradle' \
                -o \
                -name 'settings.gradle.kts' \
              \) \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR="$(dirname "$GRADLEW")"

          elif [ -n "$SETTINGS" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS")"

          else

            BUILD_FILE="$(
              find android-project \
                -type f \
                \( \
                  -name 'build.gradle' \
                  -o \
                  -name 'build.gradle.kts' \
                \) \
                | head -n 1
            )"

            if [ -z "$BUILD_FILE" ]; then
              echo "ERROR: No Android Gradle project was found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$BUILD_FILE")"

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            sed -i -E \
              's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties

          fi

          if [ ! -f "./gradlew" ]; then

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            ./gradlew wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          sed -i -E \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Repair missing Google Services configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if find . \
            -type f \
            -name 'google-services.json' \
            | grep -q .; then

            echo "google-services.json found."
            echo "Keeping Google Services configuration."

            exit 0

          fi

          echo "google-services.json not found."
          echo "Removing direct Google Services plugin references."

          while IFS= read -r -d '' FILE; do

            sed -i \
              '/com\.google\.gms\.google-services/d' \
              "$FILE" || true

            sed -i \
              '/google-services/d' \
              "$FILE" || true

          done < <(
            find . \
              -type f \
              \( \
                -name 'build.gradle' \
                -o \
                -name 'build.gradle.kts' \
              \) \
              -print0
          )

      - name: Generate Android debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then

            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          cd "$PROJECT_DIR"

          find . \
            -type f \
            \( \
              -name 'build.gradle' \
              -o \
              -name 'build.gradle.kts' \
            \) \
            -print0 |
          while IFS= read -r -d '' FILE; do

            DIR="$(dirname "$FILE")"

            cp \
              "$HOME/.android/debug.keystore" \
              "$DIR/debug.keystore"

          done

      - name: Show project information
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"

          pwd

          echo
          echo "Gradle version:"

          ./gradlew --version

          echo
          echo "Gradle files:"

          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name 'settings.gradle' \
              -o \
              -name 'settings.gradle.kts' \
              -o \
              -name 'build.gradle' \
              -o \
              -name 'build.gradle.kts' \
            \) \
            -print

      - name: Clean project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -iname '*debug*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name '*.apk' \
                | head -n 1
            )"

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: No APK was generated."

            exit 1

          fi

          mkdir -p output

          cp \
            "$APK" \
            output/app-debug.apk

          echo "Generated APK:"
          echo "$APK"

          echo
          echo "APK size:"

          ls -lh output/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/**/*.log
            ${{ env.PROJECT_DIR }}/**/build/reports/**
            ${{ env.PROJECT_DIR }}/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
