name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP
        run: |
          mkdir -p project
          unzip -o *.zip -d project

      - name: Find Android project
        run: |
          find project -name "gradlew" -type f

      - name: Build APK
        run: |
          chmod +x "$(find project -name gradlew -type f | head -1)"
          cd "$(dirname "$(find project -name gradlew -type f | head -1)")"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find project -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: project/**/build/outputs/apk/**/*.apk
