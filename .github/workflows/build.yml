name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      CI: true

      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK installation completed."


      # ============================================================
      # 5. Find ZIP
      # ============================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./android-project/*" \
              ! -path "./output/*" \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Selected ZIP:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. Extract ZIP
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted."

          echo
          echo "Extracted files:"
          find android-project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -400


      # ============================================================
      # 7. Detect Android project root
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          GRADLEW="$(
            find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1
          )"

          SETTINGS="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          BUILD_FILE="$(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
            echo "Project detected from gradlew."

          elif [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo "Project detected from settings file."

          elif [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
            echo "Project detected from build file."

          else
            echo "ERROR: Android Gradle project not found."

            echo
            echo "Possible project files:"
            find android-project \
              -maxdepth 7 \
              -type f \
              | sort \
              | head -800

            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. Print project structure
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT INFORMATION"
          echo "=========================================="

          echo
          echo "Working directory:"
          pwd

          echo
          echo "Java version:"
          java -version

          echo
          echo "Gradle-related files:"

          find . \
            -maxdepth 5 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "gradle.properties" \
            \) \
            -print


      # ============================================================
      # 9. Prepare Gradle wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Gradle wrapper properties found."

          fi

          if [ ! -f "./gradlew" ]; then

            echo "gradlew is missing."

            if command -v gradle >/dev/null 2>&1; then

              gradle wrapper \
                --gradle-version 9.3.1 \
                --distribution-type bin

            else

              echo "Installing temporary Gradle 9.3.1..."

              curl -fsSL \
                -o /tmp/gradle.zip \
                "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

              sudo unzip -q \
                /tmp/gradle.zip \
                -d /opt

              export PATH="/opt/gradle-9.3.1/bin:$PATH"

              gradle wrapper \
                --gradle-version 9.3.1 \
                --distribution-type bin

            fi
          fi

          chmod +x ./gradlew

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            sed -i -E \
              's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties

          fi

          echo
          echo "Gradle wrapper prepared."

          ./gradlew --version


      # ============================================================
      # 10. Setup Gradle
      # بعد فك ZIP وتجهيز wrapper
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 11. Remove broken Google Services references
      # ============================================================
      - name: Handle Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          GOOGLE_JSON="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_JSON" ]; then

            echo "google-services.json found:"
            echo "$GOOGLE_JSON"

          else

            echo "google-services.json not found."

            echo "Removing direct Google Services plugin references."

            while IFS= read -r -d '' FILE; do

              echo "Checking $FILE"

              sed -i \
                '/com\.google\.gms\.google-services/d' \
                "$FILE" || true

              sed -i \
                '/apply plugin:.*google-services/d' \
                "$FILE" || true

              sed -i \
                '/google-services/d' \
                "$FILE" || true

            done < <(
              find . \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print0
            )

          fi


      # ============================================================
      # 12. Prepare debug keystore
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          if [ ! -f "$DEBUG_KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo "Debug keystore is ready."

          ls -lh "$DEBUG_KEYSTORE"


      # ============================================================
      # 13. Validate Gradle configuration first
      # ============================================================
      - name: Validate Gradle configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Running Gradle help..."

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain


      # ============================================================
      # 14. Clean
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain


      # ============================================================
      # 15. Build Debug APK
      #
      # هذا هو الجزء المهم للتشخيص
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          echo "=========================================="
          echo "STARTING DEBUG APK BUILD"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            --no-parallel \
            2>&1 | tee build-logs/gradle-build.log

          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $BUILD_EXIT_CODE"

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            echo
            echo "Last 250 lines of Gradle log:"
            tail -n 250 build-logs/gradle-build.log || true

            exit "$BUILD_EXIT_CODE"

          fi

          echo
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 16. Find APK
      # ============================================================
      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei \
                "debug.*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Available build outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              -print \
              | sort

            exit 1

          fi

          rm -rf output
          mkdir -p output

          cp "$APK" output/app-debug.apk

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo
          echo "APK:"
          ls -lh output/app-debug.apk


      # ============================================================
      # 17. APK information
      # ============================================================
      - name: APK information
        if: success()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "APK INFORMATION"
          echo "=========================================="

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then

            echo
            echo "APK summary:"

            apkanalyzer \
              apk summary \
              output/app-debug.apk

          fi


      # ============================================================
      # 18. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. Upload full diagnostics if anything fails
      # ============================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            android-project/**/build-logs/**
            android-project/**/build/reports/**
            android-project/**/build/test-results/**
            android-project/**/build/outputs/logs/**
            android-project/**/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 20. Print important failure information
      # ============================================================
      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD DIAGNOSTICS"
          echo "=========================================="

          if [ -d "$PROJECT_DIR/build-logs" ]; then

            echo
            echo "Gradle logs:"
            find "$PROJECT_DIR/build-logs" \
              -type f \
              -maxdepth 2 \
              -print

            if [ -f "$PROJECT_DIR/build-logs/gradle-build.log" ]; then

              echo
              echo "=========================================="
              echo "LAST 300 LOG LINES"
              echo "=========================================="

              tail -n 300 \
                "$PROJECT_DIR/build-logs/gradle-build.log"

            fi

          fi

          echo
          echo "=========================================="
          echo "GRADLE PROBLEM REPORTS"
          echo "=========================================="

          find "$PROJECT_DIR" \
            -type f \
            \( \
              -name "*.html" \
              -o \
              -name "*.log" \
            \) \
            | grep -E \
              "(build/reports|build-logs)" \
            | head -n 200 \
            || true
