name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. Setup Java
      # IMPORTANT:
      # لا يوجد cache هنا لأن مشروع Gradle موجود داخل ZIP
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install Android SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing Android SDK packages..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."


      # ============================================================
      # 5. Find ZIP
      # ============================================================
      - name: Find ZIP project
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./android-project/*" \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            echo
            echo "ZIP files found:"
            find . -type f -iname "*.zip"
            exit 1
          fi

          echo "ZIP file detected:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. Extract ZIP
      # ============================================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android-project

          echo "Extraction completed."

          echo
          echo "Extracted files:"
          find android-project \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300


      # ============================================================
      # 7. Detect Android project
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          echo "Detecting Android Gradle project..."

          GRADLEW="$(
            find android-project \
              -type f \
              -name "gradlew" \
              | head -n 1
          )"

          SETTINGS_FILE="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | head -n 1
          )"

          ROOT_BUILD="$(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR="$(dirname "$GRADLEW")"

            echo "Detected using gradlew."

          elif [ -n "$SETTINGS_FILE" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            echo "Detected using settings.gradle."

          elif [ -n "$ROOT_BUILD" ]; then

            PROJECT_DIR="$(dirname "$ROOT_BUILD")"

            echo "Detected using build.gradle."

          else

            echo "ERROR: Android Gradle project was not found."

            echo
            echo "Project files:"
            find android-project \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -500

            exit 1

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Android project directory:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. Install Gradle
      # ============================================================
      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="9.3.1"

          echo "Checking Gradle..."

          if command -v gradle >/dev/null 2>&1; then

            echo "System Gradle found:"
            gradle --version

          else

            echo "Installing Gradle $GRADLE_VERSION..."

            curl -fsSL \
              -o /tmp/gradle.zip \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

            sudo rm -rf \
              "/opt/gradle-${GRADLE_VERSION}"

            sudo unzip -q \
              /tmp/gradle.zip \
              -d /opt

            echo \
              "/opt/gradle-${GRADLE_VERSION}/bin" \
              >> "$GITHUB_PATH"

            export PATH="/opt/gradle-${GRADLE_VERSION}/bin:$PATH"

            gradle --version

          fi


      # ============================================================
      # 9. Prepare Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          mkdir -p gradle/wrapper

          echo "Preparing Gradle wrapper..."

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Existing wrapper properties found."

            sed -i -E \
              's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties

          fi

          if [ ! -f "./gradlew" ]; then

            echo "gradlew not found."
            echo "Generating wrapper..."

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Generating missing wrapper properties..."

            ./gradlew wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          sed -i -E \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle wrapper ready."

          ./gradlew --version


      # ============================================================
      # 10. Setup Gradle dependency cache AFTER ZIP extraction
      # ============================================================
      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-${{
              hashFiles(
                '**/gradle-wrapper.properties',
                '**/*.gradle',
                '**/*.gradle.kts',
                '**/gradle/libs.versions.toml'
              )
            }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      # ============================================================
      # 11. Inspect project
      # ============================================================
      - name: Inspect Gradle project
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "PROJECT INFORMATION"
          echo "========================================"

          echo
          echo "Directory:"
          pwd

          echo
          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          ./gradlew --version

          echo
          echo "Gradle files:"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle-wrapper.properties" \
            \) \
            -print


      # ============================================================
      # 12. Handle Google Services
      # ============================================================
      - name: Handle Google Services
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          GOOGLE_JSON="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_JSON" ]; then

            echo "google-services.json found."
            echo "$GOOGLE_JSON"

          else

            echo "google-services.json was not found."

            echo "Removing Google Services plugin references."

            while IFS= read -r -d '' FILE; do

              echo "Checking:"
              echo "$FILE"

              sed -i \
                '/com\.google\.gms\.google-services/d' \
                "$FILE" || true

              sed -i \
                '/apply plugin:.*google-services/d' \
                "$FILE" || true

              sed -i \
                '/google-services/d' \
                "$FILE" || true

            done < <(
              find . \
                -type f \
                \( \
                  -name "build.gradle" \
                  -o \
                  -name "build.gradle.kts" \
                \) \
                -print0
            )

          fi


      # ============================================================
      # 13. Prepare debug keystore
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          ANDROID_DIR="$HOME/.android"

          mkdir -p "$ANDROID_DIR"

          DEBUG_KEYSTORE="$ANDROID_DIR/debug.keystore"

          if [ -f "$DEBUG_KEYSTORE" ]; then

            echo "debug.keystore already exists."

          else

            echo "Creating debug.keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo
          echo "Debug keystore:"
          ls -lh "$DEBUG_KEYSTORE"


      # ============================================================
      # 14. Clean
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. Build APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew

          echo "Starting APK build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

          echo "APK build completed."


      # ============================================================
      # 16. Find generated APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei \
                "debug.*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )"

          fi

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo
            echo "Build output directories:"

            find "$PROJECT_DIR" \
              -type d \
              -path "*/build/outputs/*" \
              -print

            exit 1

          fi

          echo
          echo "APK found:"
          echo "$APK"

          rm -rf output

          mkdir -p output

          cp \
            "$APK" \
            output/app-debug.apk

          echo
          echo "Final APK:"
          ls -lh output/app-debug.apk


      # ============================================================
      # 17. APK information
      # ============================================================
      - name: APK information
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "APK INFORMATION"
          echo "========================================"

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then

            echo
            echo "APK summary:"

            apkanalyzer \
              apk summary \
              output/app-debug.apk

          fi


      # ============================================================
      # 18. Upload APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-debug
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 19. Upload diagnostics if build fails
      # ============================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            android-project/**/build/reports/**
            android-project/**/build/outputs/logs/**
            android-project/**/*.log
          if-no-files-found: ignore
          retention-days: 7
