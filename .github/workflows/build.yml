name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.caching=false
        -Dorg.gradle.configuration-cache=false

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. Install Android SDK packages
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."


      # ============================================================
      # 5. Find ZIP
      # ============================================================
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(
            find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              ! -path "./android-project/*" \
              ! -path "./output/*" \
              | sort \
              | head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP project found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "$ZIP_FILE"


      # ============================================================
      # 6. Extract ZIP
      # ============================================================
      - name: Extract ZIP project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP_FILE" -d android-project

          echo "ZIP extracted successfully."

          echo
          echo "Extracted project:"
          find android-project \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -500


      # ============================================================
      # 7. Detect Android project root
      # ============================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -e

          GRADLEW="$(
            find android-project \
              -type f \
              -name "gradlew" \
              | sort \
              | head -n 1
          )"

          SETTINGS="$(
            find android-project \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              | sort \
              | head -n 1
          )"

          BUILD_FILE="$(
            find android-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -n "$GRADLEW" ]; then

            PROJECT_DIR="$(dirname "$GRADLEW")"

          elif [ -n "$SETTINGS" ]; then

            PROJECT_DIR="$(dirname "$SETTINGS")"

          elif [ -n "$BUILD_FILE" ]; then

            PROJECT_DIR="$(dirname "$BUILD_FILE")"

          else

            echo "::error::No Android Gradle project detected."

            find android-project \
              -maxdepth 10 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo
          echo "Detected project root:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 8. Inspect project
      # ============================================================
      - name: Inspect project
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT INFORMATION"
          echo "=========================================="

          echo
          echo "Project:"
          pwd

          echo
          echo "Important files:"

          find . \
            -maxdepth 7 \
            -type f \
            \( \
              -name "gradlew" \
              -o \
              -name "gradle-wrapper.properties" \
              -o \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
              -o \
              -name "build.gradle" \
              -o \
              -name "build.gradle.kts" \
              -o \
              -name "gradle.properties" \
              -o \
              -name "google-services.json" \
              -o \
              -name "debug.keystore" \
            \) \
            | sort


      # ============================================================
      # 9. Prepare Gradle Wrapper
      # ============================================================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ] && \
             [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "Existing Gradle Wrapper found."

          else

            echo "Gradle Wrapper is incomplete."
            echo "Creating Gradle Wrapper."

            TMP="/tmp/gradle-bootstrap"

            rm -rf "$TMP"
            mkdir -p "$TMP"

            curl -fsSL \
              -o "$TMP/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-9.3.1-bin.zip"

            unzip -q \
              "$TMP/gradle.zip" \
              -d "$TMP"

            export PATH="$TMP/gradle-9.3.1/bin:$PATH"

            gradle wrapper \
              --gradle-version 9.3.1 \
              --distribution-type bin

          fi

          chmod +x ./gradlew

          echo
          echo "Gradle version:"
          ./gradlew --version


      # ============================================================
      # 10. Setup Gradle
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true


      # ============================================================
      # 11. Disable configuration cache
      # ============================================================
      - name: Disable configuration cache
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "gradle.properties" ]; then

            sed -i \
              '/^org\.gradle\.configuration-cache=/d' \
              gradle.properties

          fi

          echo \
            "org.gradle.configuration-cache=false" \
            >> gradle.properties

          echo \
            "org.gradle.caching=false" \
            >> gradle.properties

          echo "Gradle caches disabled."


      # ============================================================
      # 12. Prepare debug keystore
      #
      # IMPORTANT:
      # المشروع يطلب:
      # android-project/debug.keystore
      # ============================================================
      - name: Prepare debug keystore
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          echo "Preparing debug keystore..."

          if [ ! -f "$KEYSTORE" ]; then

            keytool \
              -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          fi

          echo
          echo "Global debug keystore:"
          ls -lh "$KEYSTORE"

          # --------------------------------------------------------
          # انسخ المفتاح إلى ROOT الخاص بالمشروع
          # هذا هو المسار الذي ظهر في خطأ Gradle
          # --------------------------------------------------------
          cp \
            "$KEYSTORE" \
            "$PROJECT_DIR/debug.keystore"

          chmod 644 \
            "$PROJECT_DIR/debug.keystore"

          echo
          echo "Project debug keystore:"
          ls -lh \
            "$PROJECT_DIR/debug.keystore"

          # --------------------------------------------------------
          # أيضاً ضعه في مجلد app إن كان المشروع يحتاج مساراً داخلياً
          # --------------------------------------------------------
          if [ -d "$PROJECT_DIR/app" ]; then

            cp \
              "$KEYSTORE" \
              "$PROJECT_DIR/app/debug.keystore"

            chmod 644 \
              "$PROJECT_DIR/app/debug.keystore"

            echo
            echo "App debug keystore:"
            ls -lh \
              "$PROJECT_DIR/app/debug.keystore"

          fi


      # ============================================================
      # 13. Verify signing files
      # ============================================================
      - name: Verify signing configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "SIGNING FILES"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/debug.keystore" ]; then

            echo "ROOT debug.keystore: FOUND"

          else

            echo "::error::ROOT debug.keystore is missing."
            exit 1

          fi

          if [ -f "$PROJECT_DIR/app/debug.keystore" ]; then

            echo "APP debug.keystore: FOUND"

          fi

          echo
          echo "All keystores:"

          find "$PROJECT_DIR" \
            -type f \
            -name "debug.keystore" \
            -print


      # ============================================================
      # 14. Inspect Google Services
      # ============================================================
      - name: Inspect Google Services
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GOOGLE SERVICES"
          echo "=========================================="

          GOOGLE_JSON="$(
            find . \
              -type f \
              -name "google-services.json" \
              | head -n 1
          )"

          if [ -n "$GOOGLE_JSON" ]; then

            echo "google-services.json found:"
            echo "$GOOGLE_JSON"

          else

            echo "google-services.json not found."

          fi

          echo
          echo "Google Services references:"

          grep -RniE \
            "google-services|com.google.gms.google-services" \
            . \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            | head -n 100 \
            || true


      # ============================================================
      # 15. Validate Gradle
      # ============================================================
      - name: Validate Gradle
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          mkdir -p build-logs

          ./gradlew help \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/help.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "GRADLE VALIDATION FAILED"

            tail -n 300 \
              build-logs/help.log \
              || true

            exit "$CODE"

          fi


      # ============================================================
      # 16. Gradle tasks
      # ============================================================
      - name: Inspect Gradle tasks
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew tasks \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/tasks.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "TASK DISCOVERY FAILED"

            tail -n 300 \
              build-logs/tasks.log \
              || true

            exit "$CODE"

          fi


      # ============================================================
      # 17. Clean
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/clean.log

          CODE=${PIPESTATUS[0]}

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "CLEAN FAILED"

            tail -n 350 \
              build-logs/clean.log \
              || true

            exit "$CODE"

          fi


      # ============================================================
      # 18. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD DEBUG APK"
          echo "=========================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --stacktrace \
            --info \
            --warning-mode=all \
            --console=plain \
            2>&1 \
            | tee build-logs/assembleDebug.log

          CODE=${PIPESTATUS[0]}

          echo
          echo "Gradle exit code: $CODE"

          if [ "$CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "FAILED TASK"
            echo "=========================================="

            grep -nE \
              "> Task .* FAILED|Execution failed for task" \
              build-logs/assembleDebug.log \
              | tail -n 100 \
              || true

            echo
            echo "=========================================="
            echo "WHAT WENT WRONG"
            echo "=========================================="

            grep -n \
              -A 100 \
              "What went wrong:" \
              build-logs/assembleDebug.log \
              | tail -n 150 \
              || true

            echo
            echo "=========================================="
            echo "ROOT CAUSE"
            echo "=========================================="

            grep -nE \
              "Caused by:|error:|Error:|Exception:" \
              build-logs/assembleDebug.log \
              | tail -n 200 \
              || true

            echo
            echo "=========================================="
            echo "LAST 500 LINES"
            echo "=========================================="

            tail -n 500 \
              build-logs/assembleDebug.log \
              || true

            exit "$CODE"

          fi

          echo
          echo "BUILD SUCCESSFUL."


      # ============================================================
      # 19. Find APK
      # ============================================================
      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -e

          APK="$(
            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              | grep -Ei \
                "debug.*\.apk$" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then

            APK="$(
              find "$PROJECT_DIR" \
                -type f \
                -name "*.apk" \
                | head -n 1
            )

          fi

          if [ -z "$APK" ]; then

            echo "::error::APK was not generated."

            echo
            echo "Build outputs:"

            find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/*" \
              | sort

            exit 1

          fi

          rm -rf output
          mkdir -p output

          cp \
            "$APK" \
            output/app-debug.apk

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo
          echo "Generated APK:"
          echo "$APK"

          echo
          echo "APK size:"
          ls -lh output/app-debug.apk


      # ============================================================
      # 20. APK information
      # ============================================================
      - name: APK information
        if: success()
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "APK INFORMATION"
          echo "=========================================="

          ls -lh output/app-debug.apk

          if command -v apkanalyzer >/dev/null 2>&1; then

            apkanalyzer \
              apk summary \
              output/app-debug.apk \
              || true

          fi


      # ============================================================
      # 21. Upload APK
      # ============================================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 22. Upload diagnostics
      # ============================================================
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceclear-build-diagnostics
          path: |
            android-project/**/build-logs/**
            android-project/**/build/reports/**
            android-project/**/build/test-results/**
            android-project/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7


      # ============================================================
      # 23. Final failure report
      # ============================================================
      - name: Final failure report
        if: failure()
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "FINAL BUILD FAILURE"
          echo "=================================================="

          LOG="$PROJECT_DIR/build-logs/assembleDebug.log"

          if [ -f "$LOG" ]; then

            echo
            echo "FAILED TASK:"
            grep -nE \
              "> Task .* FAILED|Execution failed for task" \
              "$LOG" \
              | tail -n 100 \
              || true

            echo
            echo "CAUSE:"
            grep -nE \
              "Caused by:|error:|Error:|Exception:" \
              "$LOG" \
              | tail -n 200 \
              || true

          fi
